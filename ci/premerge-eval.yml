name: Pre-Merge Evaluation

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          echo "Running unit tests..."
          pytest -q || exit 1

      - name: Run Golden Dataset Evaluation
        run: |
          echo "Running golden dataset evaluation..."
          python ci/run_golden_eval.py --threshold 0.75 || exit 1

      - name: Summary
        run: |
          echo "All tests and evaluations completed."
