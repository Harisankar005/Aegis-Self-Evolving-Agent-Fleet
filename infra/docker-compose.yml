version: "3.9"

services:

  aegis-orchestrator:
    build: .
    container_name: aegis-orchestrator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MEMORY_DB_HOST: "memory-db"
      VECTOR_DB_HOST: "vector-db"
    depends_on:
      - memory-db
      - vector-db

  memory-db:
    image: redis:7.2
    container_name: aegis-memory
    restart: unless-stopped
    ports:
      - "6379:6379"

  vector-db:
    image: milvusdb/milvus:2.4.0
    container_name: aegis-vector-db
    restart: unless-stopped
    environment:
      ETCD_USE_EMBED: "true"
      MINIO_USE_EMBED: "true"
    ports:
      - "19530:19530"
      - "19121:19121"

networks:
  default:
    name: aegis-network
