apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-orchestrator
  labels:
    app: aegis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis
  template:
    metadata:
      labels:
        app: aegis
    spec:
      containers:
      - name: aegis-orchestrator
        image: <your-container-registry>/aegis-orchestrator:latest
        ports:
        - containerPort: 8080
        env:
        - name: REDIS_HOST
          value: "aegis-memory"
        - name: REDIS_PORT
          value: "6379"
        - name: DEBUG
          value: "false"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-memory
  labels:
    app: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-memory
  template:
    metadata:
      labels:
        app: aegis-memory
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
