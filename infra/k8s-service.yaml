apiVersion: v1
kind: Service
metadata:
  name: aegis-service
spec:
  selector:
    app: aegis
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-memory
spec:
  selector:
    app: aegis-memory
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
  type: ClusterIP
