name: Premerge Evaluation
on: [pull_request]
jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Run golden evaluation (mock)
        run: python ci/run_golden_eval.py --gold tests/golden_dataset.json
